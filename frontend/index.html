
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Support Control | The Archive</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 20% -10%, #ffd9bf 0%, transparent 55%),
          radial-gradient(circle at 100% 20%, #ffe9d8 0%, transparent 45%),
          #f5efe7;
        z-index: 9999;
        font-family: "Space Grotesk", sans-serif;
      }
      #boot-loader.hidden {
        opacity: 0;
        visibility: hidden;
        transition: opacity 220ms ease;
      }
      .boot-card {
        border: 1px solid #d4c5ad;
        border-radius: 14px;
        background: rgba(255, 249, 240, 0.95);
        padding: 14px 18px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: #576163;
        box-shadow: 0 10px 24px rgba(31, 42, 44, 0.08);
      }
      .boot-spinner {
        width: 18px;
        height: 18px;
        border-radius: 9999px;
        border: 2px solid #d4c5ad;
        border-top-color: #a03a18;
        animation: boot-spin 900ms linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="bg-[#f5efe7]">
    <div id="boot-loader" aria-live="polite">
      <div class="boot-card">
        <span class="boot-spinner" aria-hidden="true"></span>
        <span>Loading application...</span>
      </div>
    </div>
    <div id="root"></div>
    <noscript>
      <div style="padding: 1rem; font-family: Space Grotesk, sans-serif; color: #9f2d2d;">
        JavaScript is required to run this app.
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
